<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FixBit — Shop Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<div class="dash-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">🔧 FixBit</div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sidebarInitial">S</div>
      <div class="sidebar-user-info">
        <div class="name" id="sidebarName">Shop</div>
        <div class="role">Shopkeeper</div>
      </div>
    </div>
    <nav>
      <button class="nav-item active" onclick="showTab('nearby', this)">📋 Nearby Requests</button>
      <button class="nav-item" onclick="showTab('quotes', this)">📤 My Quotes</button>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="logout()">🚪 Log Out</button>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <h2 class="font-outfit">Shop Dashboard</h2>
      <div class="flex gap-2">
        <button onclick="loadNearby()" class="btn btn-secondary btn-sm">🔄 Refresh</button>
        <button onclick="toggleSidebar()" class="btn btn-outline btn-sm" id="hamburgerBtn">☰</button>
      </div>
    </div>

    <div class="dash-content">
      <!-- Nearby Requests Tab -->
      <div id="tab-nearby">
        <div id="locationWarning" class="mb-3 p-3 bg-yellow-50 border border-yellow-200 rounded text-sm">
          ⚠️ Location not set. <button onclick="updateShopLocation()" class="underline">Set location</button>
        </div>
        <div id="nearbyList"></div>
      </div>

      <!-- My Quotes Tab -->
      <div id="tab-quotes" style="display:none;">
        <h3 class="font-outfit text-lg mb-4">Sent Quotes</h3>
        <div id="quotesList"></div>
      </div>
    </div>
  </main>
</div>

<!-- Quote Modal -->
<div id="quoteModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center;">
  <div class="auth-card" style="max-width:400px; margin:1rem;">
    <h4 class="font-bold mb-3">Send Quote</h4>
    <input type="hidden" id="modalRequestId"/>
    <div class="form-group">
      <label class="form-label">Price (₹)</label>
      <input class="form-input" id="modalPrice" type="number" min="1" required/>
    </div>
    <div class="form-group">
      <label class="form-label">Message (optional)</label>
      <textarea class="form-textarea" id="modalMessage" rows="2"></textarea>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-primary flex-1" onclick="submitQuote()">Send</button>
      <button class="btn btn-outline flex-1" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="script.js"></script>
<script>
  const user = checkAuth();
  if (user) {
    document.getElementById('sidebarName').innerText = user.name || 'Shop';
    document.getElementById('sidebarInitial').innerText = (user.name || 'S')[0].toUpperCase();
  }

  let shopLat, shopLng;
  let currentRequests = [];

  window.showTab = (tabId, el) => {
    document.querySelectorAll('[id^="tab-"]').forEach(t => t.style.display = 'none');
    document.getElementById(`tab-${tabId}`).style.display = 'block';
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    if (tabId === 'nearby') loadNearby();
    if (tabId === 'quotes') loadMyQuotes();
  };

  async function updateShopLocation() {
    try {
      const pos = await getCurrentPosition();
      shopLat = pos.lat;
      shopLng = pos.lng;
      await apiRequest('/shops/location', 'PUT', { latitude: shopLat, longitude: shopLng });
      showToast('Location updated!', 'success');
      document.getElementById('locationWarning').style.display = 'none';
      loadNearby();
    } catch (e) {
      showToast('Could not update location', 'error');
    }
  }

  async function loadNearby() {
    if (!shopLat || !shopLng) {
      // Try to get from stored user? For simplicity, prompt update
      document.getElementById('locationWarning').style.display = 'block';
      return;
    }
    const requests = await loadNearbyRequests(shopLat, shopLng);
    currentRequests = requests;
    renderNearby(requests);
  }

  function renderNearby(requests) {
    const container = document.getElementById('nearbyList');
    if (!requests.length) {
      container.innerHTML = '<div class="empty-state">No nearby requests</div>';
      return;
    }
    container.innerHTML = requests.map(r => `
      <div class="request-card mb-3">
        <div class="flex justify-between">
          <h4 class="font-bold">${r.brand} ${r.model}</h4>
          <span class="dist-badge">📍 ${r.distance.toFixed(1)} km</span>
        </div>
        <p class="text-sm">${r.issue_type} - ${r.description}</p>
        <p class="text-xs text-slate-400 mt-1">Radius: ${r.radius} km</p>
        <button class="btn btn-primary btn-sm mt-3" onclick="openQuoteModal(${r.id})">Send Quote</button>
      </div>
    `).join('');
  }

  window.openQuoteModal = (requestId) => {
    document.getElementById('modalRequestId').value = requestId;
    document.getElementById('quoteModal').style.display = 'flex';
  };

  window.closeModal = () => {
    document.getElementById('quoteModal').style.display = 'none';
    document.getElementById('modalPrice').value = '';
    document.getElementById('modalMessage').value = '';
  };

  window.submitQuote = async () => {
    const requestId = document.getElementById('modalRequestId').value;
    const price = document.getElementById('modalPrice').value;
    const message = document.getElementById('modalMessage').value;
    if (!price || price <= 0) {
      showToast('Enter a valid price', 'error');
      return;
    }
    if (await sendQuote(requestId, price, message)) {
      closeModal();
      loadNearby();
    }
  };

  async function loadMyQuotes() {
    const quotes = await loadShopQuotes();
    const container = document.getElementById('quotesList');
    if (!quotes.length) {
      container.innerHTML = '<div class="empty-state">No quotes sent</div>';
      return;
    }
    container.innerHTML = quotes.map(q => `
      <div class="request-card mb-3">
        <div class="flex justify-between">
          <span class="font-bold">${q.brand} ${q.model}</span>
          <span class="price-tag">₹${q.price}</span>
        </div>
        <p>Customer: ${q.user_name}</p>
        <p>Status: <span class="badge badge-teal">${q.request_status}</span></p>
        ${q.request_status === 'accepted' ? `
          <select class="form-select mt-2" onchange="updateStatus(${q.request_id}, this.value)">
            <option value="accepted" selected>Accepted</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Completed</option>
          </select>
        ` : ''}
      </div>
    `).join('');
  }

  window.updateStatus = async (requestId, status) => {
    if (await updateRequestStatus(requestId, status)) {
      loadMyQuotes();
    }
  };

  window.toggleSidebar = () => {
    document.getElementById('sidebar').classList.toggle('open');
  };

  // Init
  (async () => {
    // Try to get shop's stored location from user object? Not stored, so prompt.
    if (user && user.latitude && user.longitude) {
      shopLat = user.latitude;
      shopLng = user.longitude;
      document.getElementById('locationWarning').style.display = 'none';
    }
    loadNearby();
  })();
</script>
</body>
</html>
