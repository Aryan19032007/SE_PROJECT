<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FixBit — User Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<div class="dash-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">🔧 FixBit</div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sidebarInitial">U</div>
      <div class="sidebar-user-info">
        <div class="name" id="sidebarName">User</div>
        <div class="role">User Account</div>
      </div>
    </div>
    <nav>
      <button class="nav-item active" onclick="showTab('newRequest', this)">📤 New Request</button>
      <button class="nav-item" onclick="showTab('myRequests', this)">📋 My Requests</button>
      <button class="nav-item" onclick="showTab('quotes', this)">💬 Quotes</button>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="logout()">🚪 Log Out</button>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <h2 class="font-outfit">User Dashboard</h2>
      <button onclick="toggleSidebar()" class="btn btn-outline btn-sm" id="hamburgerBtn">☰</button>
    </div>

    <div class="dash-content">
      <!-- New Request Tab -->
      <div id="tab-newRequest">
        <div class="card p-6">
          <h3 class="font-outfit text-lg mb-4">Submit Repair Request</h3>
          <form id="requestForm">
            <div class="grid grid-cols-2 gap-4">
              <div class="form-group">
                <label class="form-label">Brand</label>
                <select class="form-select" id="brand" required>
                  <option value="">Select</option>
                  <option>Apple</option><option>Samsung</option><option>Xiaomi</option>
                  <option>OnePlus</option><option>Other</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Model</label>
                <input class="form-input" id="model" placeholder="e.g. iPhone 14" required/>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Issue Type</label>
              <select class="form-select" id="issue_type" required>
                <option value="">Select</option>
                <option>Screen Damage</option><option>Battery</option><option>Charging</option>
                <option>Camera</option><option>Other</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Description</label>
              <textarea class="form-textarea" id="description" rows="3" required></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Photo (optional)</label>
              <input type="file" id="image" accept="image/*"/>
            </div>
            <div class="form-group">
              <label class="form-label">Search Radius</label>
              <div class="radius-selector" id="radiusGroup">
                <button type="button" class="radius-btn" data-radius="5">5 km</button>
                <button type="button" class="radius-btn selected" data-radius="10">10 km</button>
                <button type="button" class="radius-btn" data-radius="20">20 km</button>
                <button type="button" class="radius-btn" data-radius="40">40 km</button>
              </div>
              <input type="hidden" id="radius" value="10"/>
            </div>
            <input type="hidden" id="latitude"/>
            <input type="hidden" id="longitude"/>
            <button type="submit" class="btn btn-primary btn-full btn-lg">Submit Request</button>
          </form>
        </div>
      </div>

      <!-- My Requests Tab -->
      <div id="tab-myRequests" style="display:none;">
        <div class="flex justify-between mb-4">
          <h3 class="font-outfit text-lg">My Repair Requests</h3>
          <button onclick="loadMyRequests()" class="btn btn-secondary btn-sm">🔄 Refresh</button>
        </div>
        <div id="requestsList"></div>
      </div>

      <!-- Quotes Tab -->
      <div id="tab-quotes" style="display:none;">
        <h3 class="font-outfit text-lg mb-4">Quotes Received</h3>
        <div id="quotesList"></div>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="script.js"></script>
<script>
  // Global state
  let currentRequestId = null;
  const user = checkAuth();
  
  if (user) {
    document.getElementById('sidebarName').innerText = user.name || 'User';
    document.getElementById('sidebarInitial').innerText = (user.name || 'U')[0].toUpperCase();
  } else {
    window.location.href = 'login.html';
  }

  // Tab switching
  window.showTab = (tabId, el) => {
    document.querySelectorAll('[id^="tab-"]').forEach(t => t.style.display = 'none');
    document.getElementById(`tab-${tabId}`).style.display = 'block';
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    
    if (tabId === 'myRequests') loadMyRequests();
    if (tabId === 'quotes' && currentRequestId) loadQuotesForCurrentRequest();
  };

  // Radius selector
  document.querySelectorAll('[data-radius]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-radius]').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('radius').value = btn.dataset.radius;
    });
  });

  // Get location for new request
  window.addEventListener('load', async () => {
    try {
      const pos = await getCurrentPosition();
      document.getElementById('latitude').value = pos.lat;
      document.getElementById('longitude').value = pos.lng;
    } catch (e) {
      showToast('Enable location for better matching', 'info');
    }
    loadMyRequests(); // Preload requests on dashboard load
  });

  // Submit request
  document.getElementById('requestForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = {
      brand: document.getElementById('brand').value,
      model: document.getElementById('model').value,
      issue_type: document.getElementById('issue_type').value,
      description: document.getElementById('description').value,
      latitude: document.getElementById('latitude').value,
      longitude: document.getElementById('longitude').value,
      radius: document.getElementById('radius').value,
      imageFile: document.getElementById('image').files[0]
    };
    const btn = e.target.querySelector('button[type="submit"]');
    btn.classList.add('btn-loading');
    btn.disabled = true;
    const success = await submitUserRequest(formData);
    btn.classList.remove('btn-loading');
    btn.disabled = false;
    if (success) {
      e.target.reset();
      showTab('myRequests', document.querySelector('[onclick*="myRequests"]'));
    }
  });

  async function loadMyRequests() {
    const requests = await loadUserRequests();
    const container = document.getElementById('requestsList');
    if (!requests.length) {
      container.innerHTML = '<div class="empty-state">No requests yet</div>';
      return;
    }
    container.innerHTML = requests.map(r => `
      <div class="request-card mb-3">
        <div class="flex justify-between">
          <h4 class="font-bold">${r.brand} ${r.model}</h4>
          <span class="badge badge-teal">${r.status}</span>
        </div>
        <p class="text-sm text-slate-500">${r.issue_type}</p>
        <p class="mt-2">${r.description}</p>
        <div class="flex gap-2 mt-3">
          <button class="btn btn-sm btn-outline" onclick="selectRequestAndViewQuotes(${r.id})">
            View Quotes (${r.response_count || 0})
          </button>
        </div>
      </div>
    `).join('');
  }

  window.selectRequestAndViewQuotes = (requestId) => {
    currentRequestId = requestId;
    showTab('quotes', document.querySelector('[onclick*="quotes"]'));
    loadQuotesForCurrentRequest();
  };

  async function loadQuotesForCurrentRequest() {
    if (!currentRequestId) {
      document.getElementById('quotesList').innerHTML = '<div class="empty-state">Select a request to view quotes.</div>';
      return;
    }
    
    const quotes = await loadQuotesForRequest(currentRequestId);
    const container = document.getElementById('quotesList');
    
    if (!quotes.length) {
      container.innerHTML = '<div class="empty-state">No quotes yet for this request.</div>';
      return;
    }

    // Also fetch request details to know if accepted
    let requestStatus = 'pending';
    let acceptedShopId = null;
    try {
      const reqData = await apiRequest(`/requests/${currentRequestId}`);
      if (reqData.success) {
        requestStatus = reqData.request.status;
        acceptedShopId = reqData.request.accepted_shop_id;
      }
    } catch (e) {}

    container.innerHTML = quotes.map(q => {
      const isAccepted = (requestStatus === 'accepted' || requestStatus === 'in_progress' || requestStatus === 'completed') 
                         && acceptedShopId === q.shop_id;
      return `
        <div class="request-card mb-3">
          <div class="flex justify-between">
            <span class="font-bold">${q.shop_name}</span>
            <span class="price-tag">₹${q.price}</span>
          </div>
          <p class="text-sm">${q.message || 'No message'}</p>
          ${!isAccepted ? 
            `<button class="btn btn-primary btn-sm mt-2" onclick="acceptQuoteAndRefresh(${currentRequestId}, ${q.shop_id})">Accept Quote</button>` :
            `<p class="text-sm mt-2 text-green-600">✅ Accepted</p>`
          }
          ${isAccepted && q.shop_phone ? 
            `<p class="text-sm mt-2 bg-teal-50 p-2 rounded">📞 Shop Contact: ${q.shop_phone}</p>` : 
            ''
          }
        </div>
      `;
    }).join('');
  }

  window.acceptQuoteAndRefresh = async (requestId, shopId) => {
    if (await acceptQuote(requestId, shopId)) {
      loadQuotesForCurrentRequest(); // Refresh
    }
  };

  // Sidebar toggle
  window.toggleSidebar = () => {
    document.getElementById('sidebar').classList.toggle('open');
  };
</script>
</body>
</html>
