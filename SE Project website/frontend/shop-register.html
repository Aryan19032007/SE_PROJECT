<!DOCTYPE html>
<html>
<head>
  <title>Shop Register</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>

<body>

<div class="container">
  <h2>Shop Registration</h2>

<input id="name" placeholder="Shop Name">
<input id="phone" placeholder="Phone Number">
<input id="email" placeholder="Email (optional)">
<input id="password" type="password" placeholder="Password">

  <p>📍 Select Shop Location</p>
  <button onclick="getLiveLocation()">Use Live Location</button>

  <div id="map" style="height:250px;"></div>

  <button onclick="registerShop()">Register Shop</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
