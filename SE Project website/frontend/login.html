<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FixBit — Login</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card" style="max-width:420px;">

    <div class="auth-logo">
      <a href="index.html" style="text-decoration:none;">
        <h1 class="font-outfit">🔧 FixBit</h1>
      </a>
      <p>Log in to your account</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Phone or Email</label>
        <div class="input-icon-wrap">
          <span class="icon">📧</span>
          <input class="form-input" id="email" type="text" placeholder="Enter phone or email" required/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-icon-wrap">
          <span class="icon">🔒</span>
          <input class="form-input" id="password" type="password" placeholder="Enter password" required/>
        </div>
      </div>

      <div id="errorMsg" class="error-message" style="display:none;"></div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">
        Login →
      </button>
    </form>

    <div class="auth-divider">or</div>

    <p class="text-center text-sm text-slate-500 mb-3">Don't have an account?</p>
    <div class="grid grid-cols-2 gap-3">
      <a href="user-register.html" class="btn btn-secondary" style="justify-content:center;">👤 User</a>
      <a href="shop-register.html" class="btn btn-secondary" style="justify-content:center;">🏪 Shop</a>
    </div>

    <p class="text-center mt-4" style="font-size:.78rem;">
      <a href="index.html" style="color:var(--teal-600);">← Back to Home</a>
    </p>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="script.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    btn.classList.add('btn-loading');
    btn.disabled = true;
    try {
      await login(email, password);
    } catch (err) {
      document.getElementById('errorMsg').style.display = 'block';
      document.getElementById('errorMsg').innerText = err.message;
    } finally {
      btn.classList.remove('btn-loading');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
