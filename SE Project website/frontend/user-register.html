<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FixBit — Register as User</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <a href="index.html" style="text-decoration:none;">
        <h1 class="font-outfit">🔧 FixBit</h1>
      </a>
      <p>Create a free user account</p>
    </div>

    <!-- Progress bar -->
    <div style="height:4px; background:var(--slate-100); border-radius:99px; margin-bottom:1.5rem; overflow:hidden;">
      <div id="progressBar" style="height:100%; width:25%; background:linear-gradient(90deg,var(--teal-500),var(--teal-600)); border-radius:99px; transition:.4s;"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Full Name</label>
      <div class="input-icon-wrap">
        <span class="icon">👤</span>
        <input class="form-input" id="name" type="text" placeholder="Your full name" oninput="updateProgress()"/>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Phone Number <span style="color:#dc2626">*</span></label>
      <div class="input-icon-wrap">
        <span class="icon">📱</span>
        <input class="form-input" id="phone" type="tel" placeholder="+91 98765 43210" oninput="updateProgress()"/>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Email <span style="color:var(--slate-300); font-weight:400">(optional)</span></label>
      <div class="input-icon-wrap">
        <span class="icon">📧</span>
        <input class="form-input" id="email" type="email" placeholder="your@email.com" oninput="updateProgress()"/>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Password <span style="color:#dc2626">*</span></label>
      <div class="input-icon-wrap">
        <span class="icon">🔒</span>
        <input class="form-input" id="password" type="password" placeholder="Min 6 characters" oninput="updateProgress()"/>
      </div>
    </div>

    <div id="errMsg" style="display:none; background:#fef2f2; border:1px solid #fecaca; border-radius:8px; padding:.65rem .9rem; font-size:.82rem; color:#dc2626; margin-bottom:1rem;"></div>

    <button class="btn btn-primary btn-full btn-lg" id="regBtn" onclick="registerUser()">
      Create Account →
    </button>

    <div class="auth-divider">already have an account?</div>
    <a href="login.html" class="btn btn-outline btn-full" style="justify-content:center;">Log In</a>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="script.js"></script>

<script>
function updateProgress() {
  const fields = ['name','phone','email','password'];
  let filled = fields.filter(id => document.getElementById(id).value.trim()).length;
  document.getElementById('progressBar').style.width = (filled / fields.length * 100) + '%';
}
</script>
</body>
</html>
